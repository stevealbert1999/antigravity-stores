name: LedgerGuard Backend CI

on:
  push:
    paths:
      - 'accounts-payable-ai/backend/**'
      - '.github/workflows/ledgerguard-backend-ci.yml'
  pull_request:
    paths:
      - 'accounts-payable-ai/backend/**'
      - '.github/workflows/ledgerguard-backend-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accounts-payable-ai/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q
